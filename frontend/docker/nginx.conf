server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/yaml;

    # API -> PHP-FPM (Slim front controller)
    location /api/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }

    # Images downloaded during import (shared volume with app/worker)
    location ^~ /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Hashed static assets
    location ~* \.(?:js|css|woff2?|ico|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular SPA
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
